<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Top Stepped Shape -->
  <path d="M 40,210 L 40,160 L 80,160 L 80,120 L 130,120 L 130,100 L 270,100 L 270,120 L 320,120 L 320,160 L 360,160 L 360,210 Z" fill="black" />
  
  <!-- Soccer Ball -->
  <g transform="translate(200, 105) scale(1.15)">
    <circle cx="0" cy="0" r="60" fill="white" stroke="black" stroke-width="6"/>
    <!-- Center pentagon -->
    <polygon points="0,-24 23,-7 14,20 -14,20 -23,-7" fill="black" />
    <!-- Lines radiating from pentagon -->
    <line x1="0" y1="-24" x2="0" y2="-60" stroke="black" stroke-width="5"/>
    <line x1="23" y1="-7" x2="57" y2="-18" stroke="black" stroke-width="5"/>
    <line x1="14" y1="20" x2="35" y2="49" stroke="black" stroke-width="5"/>
    <line x1="-14" y1="20" x2="-35" y2="49" stroke="black" stroke-width="5"/>
    <line x1="-23" y1="-7" x2="-57" y2="-18" stroke="black" stroke-width="5"/>
    <!-- Outer pentagons -->
    <polygon points="-30,-60 0,-60 0,-45 -18,-35" fill="black"/>
    <polygon points="30,-60 0,-60 0,-45 18,-35" fill="black"/>
    <polygon points="57,-30 57,-18 35,-5 45,-25" fill="black" />
    <polygon points="-57,-30 -57,-18 -35,-5 -45,-25" fill="black" />
    <polygon points="35,60 10,40 25,25 42,42" fill="black" />
    <polygon points="-35,60 -10,40 -25,25 -42,42" fill="black" />
  </g>

  <!-- Thick horizontal line above text -->
  <rect x="40" y="215" width="320" height="8" fill="black" />

  <!-- Text Section -->
  <text x="68" y="265" font-family="'Arial Black', Impact, sans-serif" font-weight="bold" font-size="28" fill="black" text-anchor="middle">EST</text>
  <text x="200" y="272" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="62" text-anchor="middle" fill="black" transform="scale(0.95, 1) translate(10, 0)">KIGALI</text>
  <text x="332" y="265" font-family="'Arial Black', Impact, sans-serif" font-weight="bold" font-size="28" fill="black" text-anchor="middle">2026</text>

  <!-- Bottom Shield Outer Line -->
  <path d="M 60,290 L 340,290 C 340,390 200,470 200,470 C 200,470 60,390 60,290 Z" fill="none" stroke="black" stroke-width="5" />
  
  <!-- Bottom Shield Inner Black Fill -->
  <path d="M 68,298 L 332,298 C 332,385 200,458 200,458 C 200,458 68,385 68,298 Z" fill="black" />

  <!-- SPORTS ACADEMY TEXT -->
  <text x="200" y="335" font-family="Arial, sans-serif" font-weight="bold" font-size="24" text-anchor="middle" fill="white">SPORTS ACADEMY</text>

  <!-- Inner Bottom Shield (White) -->
  <clipPath id="innerShield">
    <path d="M 95,355 L 305,355 C 305,410 200,445 200,445 C 200,445 95,410 95,355 Z" />
  </clipPath>
  
  <path d="M 95,355 L 305,355 C 305,410 200,445 200,445 C 200,445 95,410 95,355 Z" fill="white" />
  
  <!-- Vertical Stripes in Inner Shield -->
  <g clip-path="url(#innerShield)">
    <rect x="135" y="355" width="22" height="100" fill="black" />
    <rect x="189" y="355" width="22" height="100" fill="black" />
    <rect x="243" y="355" width="22" height="100" fill="black" />
  </g>
</svg>
